# Standalone Compose file: the legacy racer/devkit services are deliberately absent.
# docker compose -f docker-compose.avlite.yml up --build
services:
  simulator:
    image: autodriveecosystem/autodrive_roboracer_sim:2026-icra-practice
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # -nographics: physics and LiDAR raycasts run without a display (works on Docker Desktop
    # for Windows too); camera images are blank, which this stack does not use.
    entrypoint: ["/bin/bash", "-c", "exec ./AutoDRIVE\\ Simulator.x86_64 -batchmode -nographics -ip 127.0.0.1 -port 4567"]
    depends_on:
      - bridge

  bridge:
    image: autodrive-roboracer-bridge:local
    build:
      context: .
      dockerfile: docker/Dockerfile.avlite
      target: ros-runtime
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./src/avlite_autodrive:/opt/integration:ro
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/humble/setup.bash && source /home/autodrive_devkit/install/setup.bash && exec python3 -m avlite_autodrive.simulator_bridge"]

  actuator:
    image: autodrive-roboracer-actuator:local
    build:
      context: .
      dockerfile: docker/Dockerfile.avlite
      target: ros-runtime
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config:/config:ro
      - ./src/avlite_autodrive:/opt/integration:ro

  # Wheel odometry and car-style frames for SLAM localization (localization.source: slam).
  # It never drives the car; the true pose is read once only to log the odometry origin.
  odometry:
    image: autodrive-roboracer-bridge:local
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./src/avlite_autodrive:/opt/integration:ro
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/humble/setup.bash && exec python3 -m avlite_autodrive.sim_odometry ${SIM_ODOMETRY_ARGS:-}"]
    depends_on:
      - bridge

  avlite:
    image: autodrive-roboracer-avlite:local
    build:
      context: .
      dockerfile: docker/Dockerfile.avlite
      target: avlite
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      # The car stack's SLAM, profile and localization-health modules.
      PYTHONPATH: /opt/integration:/opt/roboracer
    volumes:
      - ./config:/config:ro
      - ./src/avlite_autodrive:/opt/integration:ro
      - ./src/avlite_roboracer:/opt/roboracer:ro
    depends_on:
      - actuator
      - bridge
