# AVLite tuning for the Jetson car. Units: metres, seconds, radians, m/s.
# Geometry, the map path/frame and steering limits are filled in from hardware.yaml at
# finalization. Speeds, acceleration and braking here may be lower than the measured
# values in hardware.yaml, never higher; the supervisor refuses the plan otherwise.
# These numbers are commissioning starting points, not measured vehicle limits.
planning:
  max_velocity_mps: 1.5
  sample_spacing_m: 0.1
  acceleration_mps2: 0.8
  lateral_acceleration_mps2: 2.0
  braking_deceleration_mps2: 1.0
  braking_calibrated: false
  commissioning_speed_mps: 1.0   # Plan ceiling until braking_calibrated is set true.
  reaction_time_s: 0.3           # Must be at least measurements.command_latency_s.
  clearance_margin_m: 0.2
  tracking_allowance_m: 0.08
  curvature_weight: 0.75
  optimization_iterations: 3
c30_control:
  c32_ego_distance_front_axle: 0.33   # Replaced by vehicle.wheelbase_m.
  c32_ego_max_velocity: 1.5
  c32_ego_max_acceleration: 0.8
  c32_ego_min_acceleration: -1.0
  c32_ego_max_steering: 0.35
  c32_ego_min_steering: -0.35
  c35_lookahead_distance: 0.8
  c35_lookahead_speed_gain: 0.4
  c35_min_lookahead: 0.6
  c35_max_lookahead: 1.5
  c35_cruise_velocity: 1.5
  c35_bubble_radius: 0.3
  c35_min_gap_width: 0.2
  c35_lidar_z_min: -0.2
  c35_lidar_z_max: 0.3
  c35_valpha: 1.0
  c35_vbeta: 0.0
  c35_vgamma: 0.0
# Follow the Gap during the mapping lap uses c30_control with the mapping speed from
# hardware.yaml. These racing values apply only to its gap selection and braking model.
racing:
  lateral_acceleration_mps2: 1.5
  braking_deceleration_mps2: 0.8
  reaction_time_s: 0.3
  clearance_margin_m: 0.25
