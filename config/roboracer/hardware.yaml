# Jetson RoboRacer hardware profile. null = not measured yet.
# Recording needs only frames, topics and transform owners. The supervisor refuses
# autonomous motion until every measurement below is filled in from commissioning.
# Never copy simulator values into this file: they are not hardware measurements.
version: 1
name: jetson-roboracer

# Interface names below are the F1TENTH stack defaults (Hokuyo urg_node2, VESC driver,
# vesc_to_odom, ackermann_mux). Confirm them with tools/inspect-jetson.sh.
frames:
  map: map
  odom: odom
  base_link: base_link   # Rear-axle centre; AVLite poses and the racing line use it.
  laser: laser
  imu: imu

topics:
  scan: /scan                    # sensor_msgs/LaserScan
  odom: /odom                    # nav_msgs/Odometry from the installed motor driver
  imu: null                      # sensor_msgs/Imu; a VESC with IMU publishes /sensors/imu/raw
  slam_pose: /pose               # SLAM Toolbox pose (PoseWithCovarianceStamped)
  slam_graph: /slam_toolbox/graph_visualization  # Corrected pose-graph nodes
  drive_output: /drive           # ackermann_mux autonomous input (lower priority than teleop)
  manual_input: /teleop          # F1TENTH joystick AckermannDriveStamped; overrides autonomy

# Exactly one publisher per transform. The recording check flags any frame that is
# published by more than one parent or by both /tf and /tf_static.
transform_owners:
  odom->base_link: vesc_to_odom (publish_tf true)
  base_link->laser: f1tenth_stack bringup static_transform_publisher
  map->odom: slam_toolbox

# Static sensor mounts relative to base_link (metres, radians). Measure on the car.
mounts:
  laser: {x_m: 0.27, y_m: 0.0, yaw_rad: 0.0}

vehicle:
  wheelbase_m: 0.314
  width_m: 0.295               # Overall width; half is the footprint radius.
  length_m: 0.553
  rear_axle_to_front_m: 0.44  # Rear axle to front bumper.

steering:
  max_angle_rad: 0.22         # Largest commanded angle the servo reaches without binding.
  positive_left: true         # true if a positive steering_angle turns the car left.
  center_offset_rad: 0.0      # Added to every command after the sign is applied.

motor:
  max_command_speed_mps: 1.0 # Hard clamp on speed sent to the driver.
  stop_command_speed_mps: 0.0 # Ackermann speed used to stop; verify it brakes, not coasts.

# Commissioning results (wheels clear first, then on the floor at low speed).
measurements:
  command_latency_s: null          # Command published -> wheels respond.
  braking_deceleration_mps2: null  # Measured on the track surface.
  max_acceleration_mps2: null
  stop_test_speed_mps: null        # Highest speed at which stopping was measured.
  stopping_distance_m: null        # Measured distance from that speed.

limits:
  mapping_speed_mps: 0.6     # Slow autonomous mapping lap.
  racing_speed_mps: 1.0      # Ceiling for the racing profile; <= stop_test_speed_mps.

# Operator dead-man. Autonomous commands reach the driver only while a fresh joystick
# message shows this button held; releasing it, or the joystick going silent (out of
# range, flat battery, joy_node exit), stops the car. Find the index with
# `ros2 topic echo /joy` while pressing the button. Autonomy is refused until set.
deadman:
  topic: /joy                 # sensor_msgs/Joy from joy_node
  button: 1                # buttons[] index the operator holds during autonomy
  timeout_s: 0.25             # joy_node must publish at least this often (autorepeat)
  # true: no need to hold the button. The car runs while the joystick keeps publishing, pressing
  # the button stops it (and it stays stopped until motion ends), and a silent joystick stops it.
  # false: hold the button to run; releasing stops the car.
  stop_on_press: true

timing:
  command_timeout_s: 0.25     # Actuator stops if no fresh supervisor command arrives.
  authorization_timeout_s: 1.0 # Supervisor stops if laptop heartbeats stop.
  sensor_timeout_s: 0.25
  pose_timeout_s: 0.3
  stall_timeout_s: 6.0        # Stop when the car is commanded >= 0.3 m/s but moves < 25 % of it this long; 0 = off.

# READY thresholds. Establish from vehicle size, track clearance and measured behaviour.
localization:
  max_position_stddev_m: 0.15
  max_yaw_stddev_rad: 0.08
  min_scan_alignment: 0.7         # Fraction of scan endpoints near mapped walls.
  scan_alignment_tolerance_m: 0.10
  max_motion_mismatch_m: 0.15      # Map-frame vs odometry motion per pose update.
  max_motion_mismatch_rad: 0.1
  stable_duration_s: 2.0
