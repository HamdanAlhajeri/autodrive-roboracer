# Loaded by the adapter's --config option to resolve shared values before ROS starts.
shared_settings: driving.yaml
avlite_actuator_adapter:
  ros__parameters:
    max_speed: ${speed_mps}
    max_throttle: ${max_throttle}
    max_steer: 0.5235987756
    timeout: 0.5
    speed_kp: 0.01
    speed_ki: 0.002
    feedforward: 0.04
    # A deceleration request at or beyond this magnitude cuts forward throttle.
    # Actual zero-throttle deceleration must be measured in the simulator.
    braking_acceleration_threshold: 0.1
