# AVLite settings use metres, seconds, radians, and m/s (not normalized throttle).
shared_settings: driving.yaml
driving_mode: planned  # Follow the validated map; speed profile includes corner braking.
# Where the planned controller's pose comes from. ground_truth reads the simulator's true
# pose. slam runs SLAM Toolbox localization on a saved pose graph with wheel odometry (start
# the sim_odometry service), as on the real car. Paths are relative to this YAML.
localization:
  source: avlite
  # AVLite's own LiDAR ICP, started at the car's spawn pose (practice track, world frame) and
  # aligned to the LiDAR returns recorded in the planned map. The simulator's true pose is then
  # only a diagnostic, which is what lets the pose view compare estimate and truth.
  start_pose_world: [0.8107, 3.1583, -1.5708]
  reference: map_hits
  # Lost-pose recovery: after 5 scans in a row aligned below 0.5, search 3 m around the estimate and
  # adopt a pose that fits the map at 0.6 or better (at most one search per 3 s). 0 turns it off.
  recovery_radius_m: 3.0
  # The odometry prediction may not speed the estimate up faster than the car can accelerate (planning
  # acceleration 3.0 m/s^2 plus 10%), to stop launch wheel slip putting the estimate 1 to 2 m ahead. 0 = off.
  # (Tested and left off: it removes the launch lead but makes the estimate lag the car, and the car crashes more.)
  odometry_max_accel_mps2: 0
  odometry_limit_below_mps: 3.0   # apply that limit only below this speed (the launch); 0 = at every speed
  # The pose given to the controller is moved forward by speed x pose_lead_s (delay compensation). 0 = off.
  pose_lead_s: 0
  profile: roboracer/sim_profile.yaml
  slam_params: roboracer/slam_toolbox.yaml
  # For source: slam, from a SLAM mapping replay (roboracer_record replay --mode mapping):
  # pose_graph: maps/slam/practice/posegraph   # without extension
  # map_yaml: maps/slam/practice/map.yaml
  # start_pose: [0.0, 0.0, 0.0]                # car at startup, in the SLAM map frame
  # World pose where the mapping run's odometry started; lets the ground-truth-built race
  # map and the error diagnostic work in the world frame. Omit for a SLAM-built race map.
  # map_origin_world: [x, y, yaw]
  # source: avlite runs AVLite's own LidarLocalization with wheel-odometry speed; no SLAM map
  # needed. reference: first_scan aligns to the first scan instead of the planned map's hits.
  # source: ground_truth reads the simulator pose directly (the pose view then has nothing to compare).
  # scan_subsample: 4, map_subsample: 4, max_iterations: 10 keep one step near 20 ms.
# Browser view of the estimated pose next to the simulator's true pose, served at
# http://localhost:<port> while the stack runs (.\avlite.ps1 live opens it). Read-only.
visualization:
  pose_view: true
  port: 8765
  error_alert_m: 0.5   # the error turns red beyond this distance
planning:
  map_path: maps/practice.json  # Relative to this YAML; available under /config in Docker.
  max_velocity_mps: ${speed_mps}
  sample_spacing_m: 0.1
  # The planned top speed comes from these limits and the short practice lap, not from
  # speed_mps. Values from sweep log/sweeps/20261021-161254 test D-acc3p0: three clean
  # laps, 7.80 s rolling lap, 6.61 m/s peak (plan 6.85 m/s). Every sweep step passed,
  # so these are not measured grip/braking limits.
  # Keep these within max_acceleration/max_deceleration in actuator.yaml.
  acceleration_mps2: 3.0
  lateral_acceleration_mps2: 5.0
  # Below the qualified 3.76 m/s^2 suggestion from 20260922-134928-707-4-laps.
  # See docs/validation/high-speed-20260922.md.
  braking_deceleration_mps2: 3.5
  braking_calibrated: true  # Measured at 2.5 m/s; higher-speed screening is pending.
  commissioning_speed_mps: 2.5  # Fallback ceiling when braking_calibrated is false.
  # Add the profile's own acceleration to the speed loop instead of waiting for error.
  acceleration_feedforward: true
  reaction_time_s: 0.25
  clearance_margin_m: 0.15
  vehicle_radius_m: 0.24
  tracking_allowance_m: 0.05
  wheelbase_m: 0.324
  curvature_weight: 0.75
  optimization_iterations: 3
c30_control:
  c32_ego_distance_front_axle: 0.324
  c32_ego_max_velocity: ${speed_mps}
  c32_ego_max_acceleration: 3.0
  c32_ego_min_acceleration: -3.5
  c32_ego_max_steering: 0.5235987756
  c32_ego_min_steering: -0.5235987756
  c35_lookahead_distance: 1.0
  # Upstream uses clamp(gain * speed, min, max) when gain is nonzero.
  c35_lookahead_speed_gain: 0.4
  c35_min_lookahead: 0.6
  c35_max_lookahead: 1.8
  c35_cruise_velocity: ${speed_mps}
  c35_bubble_radius: 0.24
  c35_min_gap_width: 0.15
  c35_lidar_z_min: -0.2
  c35_lidar_z_max: 0.3
  # Speed P gain: acceleration request = c35_valpha * (target - measured), in 1/s.
  # At 1.0 the car trailed the plan by ~1.2 m/s on straights (20261021-150958-599-a2-b3).
  # With acceleration_feedforward, 2.0 lapped ~0.25 s faster than 3.0 or 4.0 (sweep A).
  c35_valpha: 2.0
  c35_vbeta: 0.0
  c35_vgamma: 0.0

# Initial screening assumptions, not measured grip/braking guarantees.
# Use telemetry to calibrate these before advancing toward 5 m/s.
racing:
  # preview-v2 experiment: retain corner preview while braking shortens steering.
  # Omit this key to restore the previous coupled lookahead behavior.
  gap_preview_min_m: 1.5
  lateral_acceleration_mps2: 3.0
  braking_deceleration_mps2: 1.5
  reaction_time_s: 0.25
  clearance_margin_m: 0.15
