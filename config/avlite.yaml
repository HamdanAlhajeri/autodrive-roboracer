# AVLite settings use metres, seconds, radians, and m/s (not normalized throttle).
shared_settings: driving.yaml
driving_mode: follow_the_gap  # Switch to planned only after preparing the map below.
planning:
  map_path: maps/practice.json  # Relative to this YAML; available under /config in Docker.
  max_velocity_mps: ${speed_mps}
  sample_spacing_m: 0.1
  acceleration_mps2: 1.0
  lateral_acceleration_mps2: 3.0
  braking_deceleration_mps2: 1.5  # Provisional; replace with measured throttle-off response.
  braking_calibrated: false
  commissioning_speed_mps: 2.5  # Until braking is measured, planned mode cannot exceed this.
  reaction_time_s: 0.25
  clearance_margin_m: 0.15
  vehicle_radius_m: 0.24
  tracking_allowance_m: 0.05
  wheelbase_m: 0.324
  curvature_weight: 0.75
  optimization_iterations: 3
c30_control:
  c32_ego_distance_front_axle: 0.324
  c32_ego_max_velocity: ${speed_mps}
  c32_ego_max_acceleration: 1.0
  c32_ego_min_acceleration: -2.0
  c32_ego_max_steering: 0.5235987756
  c32_ego_min_steering: -0.5235987756
  c35_lookahead_distance: 1.0
  # Upstream uses clamp(gain * speed, min, max) when gain is nonzero.
  c35_lookahead_speed_gain: 0.4
  c35_min_lookahead: 0.6
  c35_max_lookahead: 1.8
  c35_cruise_velocity: ${speed_mps}
  c35_bubble_radius: 0.24
  c35_min_gap_width: 0.15
  c35_lidar_z_min: -0.2
  c35_lidar_z_max: 0.3
  c35_valpha: 1.0
  c35_vbeta: 0.0
  c35_vgamma: 0.0

# Initial screening assumptions, not measured grip/braking guarantees.
# Use telemetry to calibrate these before advancing toward 5 m/s.
racing:
  # preview-v2 experiment: retain corner preview while braking shortens steering.
  # Omit this key to restore the previous coupled lookahead behavior.
  gap_preview_min_m: 1.5
  lateral_acceleration_mps2: 3.0
  braking_deceleration_mps2: 1.5
  reaction_time_s: 0.25
  clearance_margin_m: 0.15
