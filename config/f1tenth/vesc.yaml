/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # NEGATIVE because this car's motor direction is reversed (a forward command drove the car backward on
    # 19 Nov 2026). The same gain is used for the command (erpm = gain * speed) and for the odometry
    # (speed = erpm / gain), so both flip together. If the direction is later fixed in VESC Tool or by swapping
    # two motor phase wires, set this back to 4614.0.
    speed_to_erpm_gain: -4614.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.420

    port: /dev/ttyACM0
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase: measured 0.314 m on 19 Nov 2026 (stock value was .25)
    wheelbase: 0.314

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # Throttle ramp: the speed command rises by at most this much per second, from rest up to what
    # the joystick or the autonomy asks for. It sits after the mux, so it limits both. The car jittered
    # when the speed jumped (full stick); a lower value ramps up gently. Change it here and restart.
    max_acceleration: 0.5 # meters/second^2 (stock 2.5)
    # Slowing down and stopping (the B stop, a zero command) may be faster than speeding up. This needs
    # the patched throttle_interpolator.py in this folder: the stock node has no such setting and uses
    # max_acceleration for stopping too, which would make the B stop slow. Do not install a low
    # max_acceleration without the patched node.
    max_deceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec
