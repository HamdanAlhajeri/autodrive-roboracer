version: "3.9"

# Production compose — mirrors the manual docker run commands from the guide.
# Usage:
#   xhost local:root
#   docker compose up
#
# Both services share the host network so they can talk over 127.0.0.1:4567.

x-common: &common
  network_mode: host
  ipc: host
  privileged: true
  environment:
    - DISPLAY
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  simulator:
    <<: *common
    image: autodriveecosystem/autodrive_roboracer_sim:2026-icra-practice
    container_name: autodrive_roboracer_sim
    entrypoint: ["/bin/bash", "-c", "./AutoDRIVE\\ Simulator.x86_64"]

  devkit:
    <<: *common
    image: autodriveecosystem/autodrive_roboracer_api:2026-icra-practice
    container_name: autodrive_roboracer_api
    entrypoint:
      - /bin/bash
      - -c
      - |
        source /opt/ros/humble/setup.bash
        set -e
        cd /home/autodrive_devkit
        echo "[devkit] Building my_team_racer..."
        colcon build --packages-select my_team_racer --symlink-install
        source install/setup.bash
        echo "[devkit] Launching autodrive bringup..."
        ros2 launch autodrive_roboracer bringup_graphics.launch.py &
        sleep 4
        echo "[devkit] Launching racer node..."
        exec ros2 launch my_team_racer racer.launch.py
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/home/autodrive_devkit/src/my_packages
    depends_on:
      - simulator

  docs:
    build:
      context: docs
      dockerfile: Dockerfile
    container_name: autodrive_docs
    ports:
      - "8000:8000"
    volumes:
      - ./docs/source:/docs/source   # live-reload on host edits
    restart: unless-stopped
